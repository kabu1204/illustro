name: android-build

# Build the illustro sync Android app (debug APK, sideload-ready) and attach it
# as an artifact. Download from the Actions run page: illustro-sync-debug-apk.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No gradle wrapper in the repo; CI provides Gradle directly.
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: illustro-sync-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
